spring.application.name=Kanban
# Hosts hand out a PORT; local dev keeps 8080.
server.port=${PORT:8080}
# Behind a platform's HTTPS proxy, honour X-Forwarded-* so OAuth redirect URIs are https.
server.forward-headers-strategy=framework

# Set dburl to the host's JDBC URL in production (jdbc:postgresql://host:5432/db).
spring.datasource.url=${dburl:jdbc:postgresql://localhost:5432/KanbanProject}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${showsql:false}
spring.datasource.username=${username}
spring.datasource.password=${pass}


server.error.include-message=always
server.error.include-binding-errors=never
# Never send stack traces to clients; they stay in the server log.
server.error.include-stacktrace=never

spring.security.oauth2.client.registration.google.client-id=${googleclient}
spring.security.oauth2.client.registration.google.client-secret=${googlepass}
spring.security.oauth2.client.registration.google.scope=email,profile

# Base64 HMAC key, at least 32 bytes. Blank = random key per start (tokens die on restart).
jwt.secret=${jwtsecret:}
# Where the OAuth2 success handler sends the browser back to.
app.frontend-url=${frontendurl:http://localhost:5173}
