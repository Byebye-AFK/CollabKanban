spring.application.name=Kanban
spring.data-source.url=jdbc:postgresql://localhost:5432/KanbanProject
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.username=${username}
spring.datasource.password=${pass}


server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

spring.security.oauth2.client.registration.google.client-id=${googleclient}
spring.security.oauth2.client.registration.google.client-secret=${googlepass}
spring.security.oauth2.client.registration.google.scope=email,profile

# Base64 HMAC key, at least 32 bytes. Blank = random key per start (tokens die on restart).
jwt.secret=${jwtsecret:}
# Where the OAuth2 success handler sends the browser back to.
app.frontend-url=${frontendurl:http://localhost:5173}
